# Etapa 9-10 — evaluación final en SUMO y análisis estadístico.

scenarios:
  demands: [D1, D2, D3, D4, D5]   # D5 = fuera de distribución
  # Semillas nunca vistas (9-18 en el plan). Por costo de cómputo en CPU se usan 2 por escenario.
  seeds: [9, 10]

fidelity:
  segments_per_episode: 4        # segmentos de 40 pasos por episodio de test para retorno imaginado vs real
  ranking_states: 15             # estados de SUMO donde se compara el ranking imaginado vs real de acciones
  ranking_candidates: 10
  ranking_horizon: 5

stats:
  alpha: 0.05
  bootstrap: 10000
  seed: 7
