# Etapa 6 — protocolo de entrenamiento común (idéntico para cualquier modelo temporal).

loss:
  # λ en MSE(Δs) + λ·MSE(r). λ = 7/91 da el mismo peso a cada una de las 98 salidas (= MSE sobre [Δs, r]);
  # con λ = 1 cada recompensa pesaba 13 veces más que cada variable de estado (results/stage6_diagnostico.md).
  reward_weight: 0.0769230769
  rollout_k: 5            # pérdida multi-paso (opción del plan, igual para cualquier modelo); 1 = solo 1 paso
optimizer: adamw
batch_size: 256
max_epochs: 200           # plan: 200; el early stopping (paciencia 10) decide cuándo parar (ver results/stage6_diagnostico.md)
patience: 10              # early stopping sobre la pérdida de validación
# Adaptación a CPU: una "época" es una muestra aleatoria de ventanas de train (las ventanas consecutivas
# se solapan en W-1 pasos) y la pérdida de validación se mide en una submuestra fija.
samples_per_epoch: 11040  # 1/4 de las ventanas de train por época
val_max_samples: 4000
search:
  n_configs: 12           # presupuesto de ajuste de hiperparámetros
  seed: 2024              # semilla de la búsqueda aleatoria
  max_epochs: 15          # búsqueda de baja fidelidad: se ordenan las 12 configuraciones con 15 épocas
final_seeds: [0, 1, 2, 3, 4]

eval:
  horizons: [1, 3, 5, 10, 20]
  congestion_percentile: 75   # "régimen congestionado": cola > p75 de train
